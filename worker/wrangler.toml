# Cloudflare Worker configuration for Family Scanner
# Deploy with: npx wrangler deploy

name = "family-scanner"
main = "worker.js"
compatibility_date = "2024-01-01"

# KV Namespace binding
# Create the namespace first: npx wrangler kv:namespace create "CACHE"
# Then update the id below with the returned ID
[[kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_NAMESPACE_ID"  # Replace with your actual KV namespace ID

# Environment variables (set via Cloudflare dashboard or wrangler secret)
# Run: npx wrangler secret put ANTHROPIC_API_KEY
# Then enter your API key when prompted
